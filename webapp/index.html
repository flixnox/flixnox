<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Nox Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<main class="app" id="app">
  <header class="glass">
    <button class="back" id="back" aria-label="Leave room"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="brand"><b>Nox Room</b><small class="sc" id="room">live room</small></div>
    <div class="live">
      <span class="badge" id="adm" hidden>admin</span>
      <div class="pill"><span class="dot"></span><span id="n">0</span> listening</div>
    </div>
  </header>
  <div class="conn" id="conn">Connecting…</div>

  <section class="glass now">
    <div class="artwrap">
      <div class="art" id="art">
        <svg class="note" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.6" fill="#fff"/><circle cx="17.5" cy="16" r="2.6" fill="#fff"/></svg>
        <div class="eq"><span></span><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="meta">
      <span class="sc">now playing</span>
      <h1 id="title">Nothing playing</h1>
      <p id="artist">Add a song below or send /play in the group</p>
      <span class="by" id="by" hidden></span>
    </div>
    <div class="seek">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="ctrl">
      <button class="ic" id="shuf" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M16 3h5v5l-2-2-4.6 4.6-1.4-1.4L17.6 4.6 16 3zM3 6h4.5l9 11H21v2h-5.5l-9-11H3V6zm13 13l1.6-1.6-3.4-3.4 1.4-1.4 3.4 3.4L21 15v5h-5z"/></svg></button>
      <button class="ic" id="lyr" aria-label="Lyrics"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg></button>
      <button class="play" id="pp" aria-label="Play or pause"><svg class="p1" viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg><svg class="p2" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
      <button class="ic" id="skip" aria-label="Skip"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
      <button class="ic" id="loop" aria-label="Loop"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
  </section>

  <div class="qhead"><h2>Up next</h2><span class="sc" id="qc">empty</span></div>
  <div class="list" id="list"></div>
</main>

<div class="dock">
  <div class="toast glass" id="toast"></div>
  <div class="glass sugg" id="res"></div>
  <div class="glass add">
    <input id="q" type="text" maxlength="80" placeholder="Search a song to add…" autocomplete="off" enterkeyhint="search">
    <button class="go" id="addbtn">Add</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="sheetbg" id="sheetbg"></div><div class="glass card" id="sc"></div></div>
<div class="veil" id="tap" hidden><button class="go big" id="tapbtn">Tap to listen</button></div>
<div class="veil fatal" id="fatal" hidden><div class="glass card"><h3>Can't open the room</h3><p id="fatalmsg"></p></div></div>
<audio id="au" preload="auto" playsinline></audio>
<script src="/static/app.js" defer></script>
</body>
</html>
