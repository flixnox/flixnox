<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f8ff">
<title>Nox Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=__V__">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" width="0" height="0">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></symbol>
  <symbol id="i-skip" viewBox="0 0 24 24"><path d="M6 5l9 7-9 7V5zM17 5h2.4v14H17z" fill="currentColor"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><path d="M18.2 8c5.1 0 5.1 8 0 8-5.1 0-7.1-8-12.7-8-4.6 0-4.6 8 0 8 5.6 0 7.6-8 12.7-8z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-invite" viewBox="0 0 24 24"><path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM19 8v6M22 11h-6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM19 11a7 7 0 0 1-14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-micoff" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM19 11a7 7 0 0 1-14 0M12 18v3M3 3l18 18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24"><path d="M3 5h18v11H3zM8 21h8M12 16v5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-phones" viewBox="0 0 24 24"><path d="M3 14v-2a9 9 0 0 1 18 0v2M3 14h4v6H5a2 2 0 0 1-2-2v-4zM21 14h-4v6h2a2 2 0 0 0 2-2v-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="amb" id="amb"></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="shell" id="app">
  <header class="glass top">
    <button class="rnd" id="back" aria-label="Leave room"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="brand"><b>Nox Room</b><small id="room">live room</small></div>
    <span class="badge" id="adm" hidden>admin</span>
    <button class="rnd c-blue" id="inv" aria-label="Invite"><svg class="i"><use href="#i-invite"/></svg></button>
    <div class="pill"><span class="dot"></span><span id="n">0</span><span>listening</span></div>
  </header>
  <div class="conn" id="conn" hidden>Connecting…</div>

  <main class="views" id="views">
    <!-- NOW -->
    <section class="view" id="v-now">
      <div class="stage" id="stage">
        <div class="ring"></div>
        <div class="art" id="art">
          <svg class="i note"><use href="#i-note"/></svg>
          <video id="vid" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture hidden></video>
          <div class="gloss"></div>
          <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="meta">
        <span class="kick" id="kick">now playing</span>
        <h1 class="keep" id="title">Nothing playing</h1>
        <p class="keep" id="artist">Add a song to start the party</p>
        <span class="by" id="by" hidden></span>
      </div>
      <div class="seek">
        <div class="bar"><div class="fill" id="fill"><i class="knob"></i></div></div>
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>
      <div class="ctrl">
        <button class="cb c-violet" id="shuf" aria-label="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg><small>shuffle</small></button>
        <button class="cb big c-blue" id="pp" aria-label="Play or pause"><svg class="i p-pause"><use href="#i-pause"/></svg><svg class="i p-play"><use href="#i-play"/></svg></button>
        <button class="cb c-sky" id="skip" aria-label="Skip"><svg class="i"><use href="#i-skip"/></svg><small>skip</small></button>
      </div>
      <div class="chips">
        <button class="chip c-mint" id="loop"><svg class="i"><use href="#i-loop"/></svg>loop</button>
        <button class="chip c-teal" id="auto"><svg class="i"><use href="#i-auto"/></svg>autoplay</button>
        <button class="chip c-amber" id="lyr"><svg class="i"><use href="#i-lyrics"/></svg>lyrics</button>
      </div>
      <p class="hint" id="hint" hidden></p>
    </section>

    <!-- SEARCH -->
    <section class="view" id="v-search" hidden>
      <div class="glass sbox">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="q" class="keep" type="text" maxlength="80" placeholder="search songs or artists" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="clr" id="qx" aria-label="Clear" hidden><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div id="sugg">
        <h2 class="sec">try these</h2>
        <div class="tags" id="tags"></div>
      </div>
      <div id="out" hidden></div>
    </section>

    <!-- QUEUE -->
    <section class="view" id="v-queue" hidden>
      <div class="qhead"><h2 class="sec">up next</h2><span class="count" id="qc">empty</span></div>
      <div class="tools" id="tools">
        <button class="chip c-violet" id="q-shuf"><svg class="i"><use href="#i-shuffle"/></svg>shuffle</button>
        <button class="chip c-teal" id="q-auto"><svg class="i"><use href="#i-auto"/></svg>autoplay</button>
        <button class="chip c-rose" id="q-clear"><svg class="i"><use href="#i-trash"/></svg>clear</button>
      </div>
      <div class="list" id="list"></div>
    </section>
    <!-- PEOPLE -->
    <section class="view" id="v-people" hidden>
      <div class="qhead"><h2 class="sec">in the room</h2><span class="count" id="pc">0</span></div>
      <div class="glass sstage" id="sstage" hidden><video id="scr" autoplay playsinline></video><span class="stagetag" id="stagetag"></span></div>
      <div class="glass vdock" id="vdock">
        <button class="vbtn c-blue" id="v-join"><svg class="i"><use href="#i-mic"/></svg><span>join voice</span></button>
        <button class="vbtn c-mint" id="v-mute" hidden><svg class="i"><use href="#i-mic"/></svg><span>mute</span></button>
        <button class="vbtn c-violet" id="v-share" hidden><svg class="i"><use href="#i-screen"/></svg><span>share</span></button>
        <button class="vbtn c-rose" id="v-leave" hidden><svg class="i"><use href="#i-x"/></svg><span>leave</span></button>
      </div>
      <p class="hint" id="vhint">voice and screen share are live between members, no recording.</p>
      <div class="list" id="plist"></div>
    </section>
  </main>

  <div class="bottom">
    <div class="toast glass" id="toast"><i></i><span id="toastx"></span></div>
    <div class="mini glass" id="mini" hidden>
      <div class="thumb" id="m-th"></div>
      <div class="mt"><b class="keep" id="m-t"></b><span class="keep" id="m-a"></span></div>
      <button class="rnd c-blue" id="m-pp" aria-label="Play or pause"><svg class="i p-pause"><use href="#i-pause"/></svg><svg class="i p-play"><use href="#i-play"/></svg></button>
      <div class="mbar"><div class="mfill" id="m-fill"></div></div>
    </div>
    <nav class="nav glass" id="nav">
      <i class="slider" id="slider"></i>
      <button class="tab on" data-tab="now"><svg class="i"><use href="#i-note"/></svg><span>now</span></button>
      <button class="tab" data-tab="search"><svg class="i"><use href="#i-search"/></svg><span>search</span></button>
      <button class="tab" data-tab="queue"><svg class="i"><use href="#i-list"/></svg><span>queue</span><em id="qb" hidden>0</em></button>
      <button class="tab" data-tab="people"><svg class="i"><use href="#i-people"/></svg><span>people</span><em id="pb" hidden>0</em></button>
    </nav>
  </div>
</div>

<div id="remote" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheetbg" id="sheetbg"></div><div class="glass card" id="sc"></div></div>
<div class="veil" id="tap" hidden><button class="cta c-blue" id="tapbtn"><svg class="i"><use href="#i-play"/></svg>tap to listen</button></div>
<div class="veil" id="fatal" hidden><div class="glass card"><h3>Can't open the room</h3><p id="fatalmsg"></p><div class="btns" style="margin-top:16px"><button class="bx c-sky" id="fclose">Close</button><button class="bx c-blue" id="fretry">Try again</button></div></div></div>
<audio id="au" preload="auto" playsinline></audio>
<script src="/static/app.js?v=__V__" defer></script>
</body>
</html>
